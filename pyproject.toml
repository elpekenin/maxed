[project]
name = "maxed"
version = "0.1.0"
description = "Telegram bot to track maxed Pokémon in Pokémon GO."
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.61.0",
    "python-dotenv>=1.2.2",
    "python-telegram-bot[callback-data]>=22.8",
    "sqlmodel>=0.0.39",
    "vitrine-tg>=0.4.0",
]

[build-system]
requires = ["setuptools"]

[project.scripts]
bot = "maxed.main:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["missing-copyright-notice"]

[tool.ruff.lint.extend-per-file-ignores]
"pokebattler.py" = ["N815"] # mixedCase in API response

[tool.ty.analysis]
strict-literal-narrowing = true

[tool.ty.rules]
blanket-ignore-comment = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"
division-by-zero = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
