[project]
name = "maxed"
version = "0.1.0"
description = "Telegram bot to track maxed Pokémon in Pokémon GO."
requires-python = ">=3.12"
dependencies = [
    "peewee>=4.2.1",
    "playwright>=1.61.0",
    "python-telegram-bot[callback-data]>=22.8",
]

[build-system]
requires = ["setuptools"]

[project.scripts]
bot = "maxed.main:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["D", "missing-copyright-notice"]

[tool.ty.analysis]
strict-literal-narrowing = true

[tool.ty.rules]
blanket-ignore-comment = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"
division-by-zero = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
